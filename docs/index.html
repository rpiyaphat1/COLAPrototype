<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IEP Mobile Assistant</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Kanit:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --white: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text-dark);
            /* ใช้ dvh เพื่อให้พอดีกับความสูงจอโทรศัพท์จริงๆ */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Splash Screen --- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            color: white;
            transition: opacity 0.5s ease-out;
        }

        .logo-wrapper {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .logo-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* --- App Layout --- */
        header {
            background: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E5E7EB;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Kanit';
            font-size: 1.2rem;
            margin: 0;
            color: var(--primary);
        }

        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* --- Chat View --- */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .ai {
            background: var(--white);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            background: var(--white);
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #E5E7EB;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid #E5E7EB;
            background: #F9FAFB;
            outline: none;
            font-size: 16px;
        }

        /* --- Student Cards --- */
        .student-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .student-card {
            background: var(--white);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            background: #ECF0FF;
            color: var(--primary);
            margin-right: 5px;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            background: var(--white);
            border-top: 1px solid #E5E7EB;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-light);
            background: none;
            border: none;
            width: 33%;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div id="splashScreen">
        <div class="logo-wrapper">
            <img id="appLogo" src="logo.png" alt="Logo">
        </div>
        <h2 style="font-family: 'Kanit'; margin: 0; letter-spacing: 2px;">IEP ASSISTANT</h2>
        <div style="margin-top: 30px; font-size: 12px; font-weight: 300;">กำลังเข้าสู่ระบบ...</div>
    </div>

    <header>
        <h1>IEP <span style="font-weight: 300; color: #9CA3AF;">Smart</span></h1>
        <div style="font-size: 13px; font-weight: 500;">
            <span style="color: #10B981;">●</span> ครูพัชรากร
        </div>
    </header>

    <main class="content">
        <div id="chatPage" class="page active">
            <div class="chat-container" id="chatBox">
                <div class="bubble ai"><strong>สวัสดีค่ะคุณครูพัชรากร 😊</strong><br>มีอะไรให้ช่วยไหมคะ?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..."
                    onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-main" onclick="sendMessage()">ส่ง</button>
            </div>
        </div>

        <div id="dirPage" class="page">
            <div class="student-list-scroll" id="studentList"></div>
        </div>

        <div id="settingPage" class="page" style="padding: 20px;">
            <h3>การตั้งค่า</h3>
            <button class="btn-main" style="width:100%; background:#FEE2E2; color:var(--danger);"
                onclick="location.reload()">ออกจากระบบ</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="navTo('chat', this)"><svg fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
                </path>
            </svg><span>หน้าหลัก</span></button>
        <button class="nav-item" onclick="navTo('dir', this)"><svg fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                </path>
            </svg><span>นักเรียน</span></button>
        <button class="nav-item" onclick="navTo('setting', this)"><svg fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                </path>
            </svg><span>ตั้งค่า</span></button>
    </nav>

    <script>
        const config = {
            logoPath: "logo.png",
            splashDuration: 3000
        };

        const students = [
            {
                nick: "น้องเอ",
                full: "ด.ช.สมชาย ใจดี",
                age: 8,
                type: "LD การอ่าน",
                hobby: "ชอบแมว",
                symptom: "อ่านคำควบกล้ำไม่ได้ สับสน ถ/ภ, ด/ต",
                handle: "🐈 **แนวทางดูแล**\n1. ใช้บัตรคำรูปแมว\n2. ใช้ไม้บรรทัดช่วยชี้บรรทัด\n3. ให้รางวัลเป็นสติกเกอร์แมว"
            }
        ];

        window.onload = () => {
            renderStudents();
            document.getElementById('appLogo').src = config.logoPath;
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, config.splashDuration);
        };

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (!val) return;

            addBubble(val, 'user');
            input.value = '';

            setTimeout(() => {
                // คืนค่าข้อความชุดเดิมของคุณครูทั้งหมด
                let res = `📊 <strong>วิเคราะห์ข้อมูลนักเรียน (เคส LD การอ่าน)</strong><br>`;
                res += `👤 <strong>ชื่อ:</strong> เด็กชายสมชาย ใจดี ป.2/5<br>`;
                res += `👤 <strong>ชื่อเล่น:</strong> น้องเอ<br>`;
                res += `👤 <strong>อายุ:</strong> 8 ขวบ<br>`;
                res += `🐱 <strong>ความสนใจพิเศษ:</strong> ชอบแมวมาก<br><hr>`;
                res += `📌 <strong>อาการ/ปัญหาที่พบ:</strong><br>`;
                res += `• อ่านสะกดคำที่มีพยัญชนะควบกล้ำไม่ได้<br>`;
                res += `• สับสนตัวอักษรที่หัวคล้ายกัน (เช่น ถ-ภ, ด-ต)<br>`;
                res += `• มักจะอ่านเว้นบรรทัดหรือข้ามคำ<br><br>`;
                res += `✅ <strong>วิธีสอนแนะนำสำหรับครูพัชรากร:</strong><br>`;
                res += `1. <strong>Gamification:</strong> ใช้เกม 'แมวหิวคำศัพท์' โดยให้เด็กป้อนบัตรคำรูปแมวเมื่ออ่านถูก<br>`;
                res += `2. <strong>Visual Aid:</strong> ใช้ไม้บรรทัดหรือกระดาษเจาะรูช่วยโฟกัสทีละบรรทัด<br>`;
                res += `3. <strong>Cat Theme Phonics:</strong> ฝึกออกเสียงโดยเชื่อมโยงกับเสียงสัตว์ที่เด็กชอบเพื่อสร้างแรงจูงใจ<br>`;
                res += `4. <strong>Multi-Sensory:</strong> ให้เด็กลองเขียนตัวอักษรบนทรายหรือปั้นดินน้ำมันในคำที่สับสนบ่อยๆ`;

                addBubble(res, 'ai');
            }, 600);
        }

        function addBubble(t, type) {
            const box = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = `bubble ${type}`;
            d.innerHTML = t;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        function navTo(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId + 'Page').classList.add('active');
            btn.classList.add('active');
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = `<h3>รายชื่อนักเรียน</h3>` + students.map(s => `
                <div class="student-card" onclick="document.getElementById('chatInput').value='${s.nick}'; sendMessage(); navTo('chat', document.querySelector('.nav-item'))">
                    <strong>${s.full} (${s.nick})</strong><br>
                    <span class="tag">${s.type}</span>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
